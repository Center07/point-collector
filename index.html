<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Point Collector</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  html, body { background: #000; margin: 0; padding: 0; min-height: 100%; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 560px; margin: 0 auto; padding: calc(20px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom)); }
  h1 { color: #fff; font-size: 28px; letter-spacing: 1px; text-align: center; margin: 0; font-weight: 800; }
  h1 .gold { color: #FACC15; }
  .box { background: #111318; border: 1px solid #23262e; border-radius: 16px; padding: 18px; margin-top: 16px; }
  .box.top { border-color: #FACC15; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .name { font-size: 17px; font-weight: 700; }
  .badge { font-size: 11px; font-weight: 800; background: #FACC15; color: #000; border-radius: 999px; padding: 3px 8px; letter-spacing: .5px; }
  .pts { font-size: 44px; font-weight: 800; color: #FACC15; margin-top: 6px; }
  .pts small { font-size: 18px; color: #9CA3AF; font-weight: 600; }
  .rate { color: #9CA3AF; font-size: 14px; margin-top: 2px; }
  .days { color: #fff; font-size: 15px; font-weight: 700; margin-top: 10px; }
  .days span { color: #FACC15; }
</style>
</head>
<body>
  <h1>POINT <span class="gold">COLLECTOR</span></h1>

  <div class="box top">
    <div class="row"><span class="name">Nirmal</span><span class="badge">TOP</span></div>
    <div class="pts">7,727 <small>pts</small></div>
    <div class="rate">260 a day</div>
    <div class="days"><span>22 days left</span> · Dec 17</div>
  </div>

  <div class="box">
    <div class="row"><span class="name">Dad</span></div>
    <div class="pts">5,101 <small>pts</small></div>
    <div class="rate">160 a day</div>
    <div class="days"><span>52 days left</span> · Jan 12</div>
  </div>

  <div class="box">
    <div class="row"><span class="name">Mom</span></div>
    <div class="pts">5,000 <small>pts</small></div>
    <div class="rate">160 a day</div>
    <div class="days"><span>53 days left</span> · Jan 13</div>
  </div>
</body>
</html>
